# On a research/ingest pull request, rebuild the merged data files and validate them,
# then commit the result to the branch so merging the PR is all that is left.
name: Ingest merge
on:
  pull_request:
    branches: [main]
    paths: ["data/parts/**"]
permissions:
  contents: write
jobs:
  merge:
    if: startsWith(github.head_ref, 'ingest/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run merge:data
      - run: npm run validate:data
      - name: Commit regenerated data
        run: |
          git config user.name "unhyped-bot"
          git config user.email "unhyped-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Regenerate merged data" && git push
